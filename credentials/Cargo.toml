[package]
name = "mcp-gateway-credentials"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Credential resolution for the MCP gateway — provider chain for secure secret lookup"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
region = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
# Installs a crypto provider so tests that build their own HTTP client
# have a process default before it sets up its TLS layer. `ring` here is
# a test-only choice; the binary selects the real provider.
mcp-gateway-crypto = { workspace = true, features = ["ring"] }
tempfile = { workspace = true }
