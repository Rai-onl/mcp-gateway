[package]
name = "mcp-gateway-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP proxy runtime — forwards MCP requests to upstream remote servers"

[lints]
workspace = true

[dependencies]
mcp-gateway-config = { workspace = true }
mcp-gateway-credentials = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
# Installs a crypto provider so building a `Proxy` (which eagerly builds
# a reqwest client with no bundled provider) has a process default.
# `ring` is a test-only choice; the binary selects the real provider.
mcp-gateway-crypto = { workspace = true, features = ["ring"] }
tokio = { workspace = true }
